<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcultor-JS</title>
  <link rel="stylesheet" href="sources/css/output.css" />
  <link rel="stylesheet" href="sources/css/styles.css" />
 
</head>

<body
  class="relative min-h-screen overflow-hidden flex items-center justify-center bg-[#e0e5ec] dark:bg-[#1a1c1e] p-6 transition-colors duration-300">
  <div class="ambient-stage" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-orb orb-a"></div>
    <div class="ambient-orb orb-b"></div>
    <div class="ambient-orb orb-c"></div>
    <div class="ambient-beam beam-a"></div>
    <div class="ambient-beam beam-b"></div>
  </div>
  <!-- Theme Toggle Button -->
  <button
    class="fixed top-6 right-6 z-50 w-14 h-14 rounded-full bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[8px_8px_16px_#b8bac0,-8px_-8px_16px_#ffffff] dark:shadow-[8px_8px_16px_#0e1012,-8px_-8px_16px_#26282a] flex items-center justify-center text-gray-500 dark:text-gray-400 transition-all duration-200 ease-out hover:scale-110 active:scale-95 active:bg-white/40 dark:active:bg-black/20 focus:outline-none"
    id="theme-toggle" aria-label="Changer de thème">
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden h-7 w-7 dark:block" viewBox="0 0 24 24" fill="none"
      stroke="currentColor">
      <circle cx="12" cy="12" r="4" stroke-width="1.8" />
      <path stroke-linecap="round" stroke-width="1.8"
        d="M12 2.75v2.5M12 18.75v2.5M21.25 12h-2.5M5.25 12h-2.5M18.54 5.46l-1.77 1.77M7.23 16.77l-1.77 1.77M18.54 18.54l-1.77-1.77M7.23 7.23L5.46 5.46" />
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" class="block h-7 w-7 dark:hidden" viewBox="0 0 24 24" fill="none"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
        d="M20.5 14.75A8.75 8.75 0 1 1 9.25 3.5a7 7 0 0 0 11.25 11.25Z" />
    </svg>
  </button>

  <button
    class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[8px_8px_16px_#b8bac0,-8px_-8px_16px_#ffffff] dark:shadow-[8px_8px_16px_#0e1012,-8px_-8px_16px_#26282a] flex items-center justify-center text-gray-500 dark:text-gray-400 transition-all duration-200 ease-out hover:scale-110 active:scale-95 active:bg-white/40 dark:active:bg-black/20 focus:outline-none"
    id="history-btn" aria-label="Afficher l'historique">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 transition-transform duration-200 group-hover:rotate-12"
      fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4l3 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </button>

  <div class="relative z-10 text-center">
    <div
      class="fixed hidden h-[666px] w-80 md:w-96 lg:w-[30rem] p-6 md:p-8 rounded-3xl bg-[#e0e5ec]/88 dark:bg-[#1a1c1e]/88 shadow-[8px_8px_24px_#b8bac0,-8px_-8px_24px_#ffffff] dark:shadow-[8px_8px_24px_#0e1012,-8px_-8px_24px_#26282a] flex flex-col border border-white/30 dark:border-white/8 backdrop-blur-xl"
      id="history-container">
      <!-- Bouton fermer -->
      <button
        class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] rounded-full transition hover:bg-red-200 dark:hover:bg-red-900 active:bg-white/40 dark:active:bg-black/20 focus:outline-none"
        id="history-close-btn" title="Fermer l'historique">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <button
        class="absolute top-4 left-4 w-8 h-8 flex items-center justify-center bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] rounded-full transition hover:bg-red-200 dark:hover:bg-red-900 active:bg-white/40 dark:active:bg-black/20 focus:outline-none"
        id="clear-history-btn" title="Effacer l'historique">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M8 7V4a1 1 0 011-1h6a1 1 0 011 1v3" />
        </svg>
      </button>
      <h2 class="text-2xl font-semibold mb-8 mt-4 text-gray-700 dark:text-gray-300">Historique</h2>
      <ul class="space-y-3 flex-1 overflow-y-auto" id="history-list"></ul>
    </div>

    <div
      class="w-80 md:w-96 lg:w-[30rem] p-6 md:p-8 rounded-3xl bg-[#e0e5ec]/88 dark:bg-[#1a1c1e]/84 shadow-[8px_8px_24px_#b8bac0,-8px_-8px_24px_#ffffff] dark:shadow-[8px_8px_24px_#0e1012,-8px_-8px_24px_#26282a] border border-white/35 dark:border-white/8 backdrop-blur-xl">
      <div
        class="h-16 md:h-20 bg-[#e0e5ec] dark:bg-[#1a1c1e] rounded-t-xl flex items-center justify-end px-4 md:px-6 shadow-inner border border-b-0 border-[#e0e5ec] dark:border-[#26282a]">
        <input type="text" autocomplete="off" placeholder="0" value="" id="champ"
          class="w-full bg-transparent text-left outline-none text-3xl md:text-4xl font-medium text-gray-700 dark:text-gray-200 select-text"
          style="caret-color: #74b9ff;" />
      </div>
      <div
        class="h-8 md:h-12 mb-6 md:mb-8 bg-[#e0e5ec] dark:bg-[#1a1c1e] rounded-b-xl flex items-center justify-end px-4 md:px-6 shadow-inner border border-t-0 border-[#e0e5ec] dark:border-[#26282a]">
        <input type="text" value="0" id="resultDisplay" readonly
          class="w-full bg-transparent text-right outline-none text-2xl md:text-3xl font-medium text-gray-400 dark:text-gray-500 select-text" />
      </div>
      <div class="grid grid-cols-4 gap-4 md:gap-6">
        <!-- Ligne 1 -->
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-red-400 font-bold active:bg-white/40 dark:active:bg-black/20 active:shadow-inner active:text-red-600 transition-all"
          id="clear-btn">C</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-red-400 font-bold active:bg-white/40 dark:active:bg-black/20 active:shadow-inner active:text-red-600 transition-all"
          id="backspace-btn" aria-label="Supprimer le dernier caractere">DEL</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-blue-400 font-semibold active:shadow-inner active:text-blue-600 transition-all calc-btn"
          data-value="(">(</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-blue-400 font-semibold active:shadow-inner active:text-blue-600 transition-all calc-btn"
          data-value=")">)</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-blue-400 font-semibold active:shadow-inner active:text-blue-600 transition-all calc-btn"
          data-value="/">÷</button>
        <!-- Ligne 2 -->
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="7">7</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="8">8</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="9">9</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-blue-400 font-semibold active:shadow-inner active:text-blue-600 transition-all calc-btn"
          data-value="*">x</button>
        <!-- Ligne 3 -->
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="4">4</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="5">5</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="6">6</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-blue-400 font-semibold active:shadow-inner active:text-blue-600 transition-all calc-btn"
          data-value="-">-</button>
        <!-- Ligne 4 -->
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="1">1</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="2">2</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="3">3</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-blue-400 font-semibold active:shadow-inner active:text-blue-600 transition-all calc-btn"
          data-value="+">+</button>
        <!-- Ligne 5 -->
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value="0">0</button>
        <button
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-[#e0e5ec] dark:bg-[#1a1c1e] shadow-[4px_4px_8px_#b8bac0,-4px_-4px_8px_#ffffff] dark:shadow-[4px_4px_8px_#0e1012,-4px_-4px_8px_#26282a] text-lg md:text-2xl text-gray-600 dark:text-gray-300 font-semibold active:shadow-inner active:text-gray-800 transition-all calc-btn"
          data-value=".">.</button>
        <button id="operate"
          class="h-12 md:h-16 flex items-center justify-center rounded-xl bg-gradient-to-br from-[#74b9ff] to-[#e0e5ec] dark:to-[#1a1c1e] shadow-[4px_4px_16px_#b8bac0,-4px_-4px_16px_#ffffff] dark:shadow-[4px_4px_16px_#0e1012,-4px_-4px_16px_#26282a] text-3xl md:text-4xl text-white font-bold active:shadow-inner active:text-blue-700 transition-all">=</button>
      </div>
    </div>
  </div>
  <script src="sources/js/script.js"></script>
</body>

</html>
